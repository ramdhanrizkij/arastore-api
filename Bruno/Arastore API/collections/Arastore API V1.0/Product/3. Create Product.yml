info:
  name: "3. Create Product "
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/products"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "category_id":"9a6315fa-66a5-49df-9b45-906e2f023f20",
        "sku":"SKU-03",
        "name":"Iphone 17",
        "description":"Iphone model terbaru",
        "price":22000000,
        "stock":10,
        "weight":500,
        "status":"DRAFT"
      }
  auth:
    type: bearer
    token: "{{ACCESS_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

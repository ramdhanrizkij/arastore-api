  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/products?page=1&per_page=10&sort=created_at&order=DESC&search="
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "10"
      type: query
    - name: sort
      value: created_at
      type: query
    - name: order
      value: DESC
      type: query
    - name: search
      value: ""
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

